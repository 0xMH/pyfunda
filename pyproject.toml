[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfunda"
version = "3.1.4"
description = "Python API wrapper for Funda.nl, the Dutch real estate platform. Reverse-engineered mobile API client, no scraping, no Selenium, no CAPTCHA."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "0xMH" }
]
keywords = [
    "funda",
    "funda-api",
    "funda-nl",
    "funda-scraper",
    "real-estate",
    "real-estate-api",
    "netherlands",
    "dutch",
    "housing",
    "housing-api",
    "api",
    "api-wrapper",
    "rest-api",
    "client",
    "sdk",
    "mobile-api",
    "reverse-engineering",
    "scraper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "curl-cffi>=0.14.0",
    "tls-client>=1.0.1",
    "typing_extensions>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/0xMH/pyfunda"
Repository = "https://github.com/0xMH/pyfunda"
Issues = "https://github.com/0xMH/pyfunda/issues"

[tool.hatch.build.targets.wheel]
packages = ["funda"]
